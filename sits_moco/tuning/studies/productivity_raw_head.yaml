# Ablation: z-scored municipal labels vs raw productivity (t/ha).
#
# Same architecture/recipe as productivity_trial006_baseline. Trial 1 is the
# current default (train on (y-μ)/σ, report RMSE/R² in t/ha). Trial 2 trains
# and scores on unnormalized yield_t_ha.
#
#   python run_tuning_study.py show tuning/studies/productivity_raw_head.yaml --list-trials
#   python run_tuning_study.py run tuning/studies/productivity_raw_head.yaml --skip-completed

name: productivity_raw_head

objective: val_r2

output_dir: ./results/tuning

base:
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral_xavier
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 100
  workers: 5
  sequencelength: 45
  batchsize: 40
  learning_rate: 5.0e-4
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [20, 75]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  pixel_chunk_size: 8000
  chunks_per_grad: 15
  prefetch_chunks: 6
  auto_chunks_per_grad: true
  auto_chunks_per_grad_min: 1
  auto_chunks_per_grad_vram_frac: 0.95
  auto_chunks_per_grad_vram_target_frac: 0.90
  auto_pixel_chunk_size_min: 3500
  auto_pixel_chunk_size_step: 100
  quiet_training: true
  suffix_prefix: rawhead
  model_n_layers: 1
  model_d_model: 96
  model_n_head: 8
  model_d_inner: 64
  model_dropout: 0.3

search:
  strategy: list
  trials:
    - head_output: zscore
    - head_output: raw
