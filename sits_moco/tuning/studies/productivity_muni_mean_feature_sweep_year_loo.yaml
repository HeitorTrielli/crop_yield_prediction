# Year leave-one-out of the 170 mega-pixel MEAN feature layouts
# (same recipes as productivity_muni_mean_feature_sweep).
#
# One trial = one layout. Each trial runs five holdout years (2020–2024);
# train = the other years, valid = test = the left-out year. The trial
# score is the mean val R² / test R² (and RMSE/MAE/…) across folds that
# actually trained. Per-year values are in trial_XXX/folds.json and
# summary.csv (val_r2_2021, test_r2_2021, …).
#
# Layout:
#   results/tuning/<study>/trial_001/          # e.g. mp_bands__none
#     params.json
#     folds.json                               # per-year + means
#     loo2020/ training/ …
#     loo2021/ …
#
# Target mean/std and the input scaler are per holdout year
# (files/train_input_scaler_loo{YYYY}.json; auto-fit if missing).
#
# Drop two 2019-2020 mega-pixel files that never got climate extras
# (4112009, 4113734 still C=13). Holdout 2020 runs on the other munis.
#
# Trial IDs match the CSV-split feature sweep (trial_111 = mp_tri__thermo).
#
# Preview:
#   python run_tuning_study.py show tuning/studies/productivity_muni_mean_feature_sweep_year_loo.yaml --list-trials
#
# Run:
#   python run_tuning_study.py run tuning/studies/productivity_muni_mean_feature_sweep_year_loo.yaml --skip-completed
#
# Summarize:
#   python run_tuning_study.py summarize tuning/studies/productivity_muni_mean_feature_sweep_year_loo.yaml
#   python run_tuning_study.py leaderboard tuning/studies/productivity_muni_mean_feature_sweep_year_loo.yaml --top 20

name: productivity_muni_mean_feature_sweep_year_loo

objective: test_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  exclude_muni_years: "4112009:2020,4113734:2020"
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-5
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [150, 750]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  model_n_layers: 1
  model_d_model: 64
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4

search:
  strategy: feature_sweep
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_loo{holdout_year}.json
