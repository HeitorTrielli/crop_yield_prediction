# Learned multi-query attention temporal pooling on the MoCo Paraná top-5 arches.
#
# Motivation (debug probes): collapsing the season with a single exp(NDVI)-weighted
# mean discards phenology signal that separates mid vs high yields. Attention
# pooling keeps the NDVI prior as a learnable gate and lets 2–4 queries specialize
# on different parts of the season (green-up / peak / senescence).
#
# Same MoCo encoder matching as productivity_top5_moco_parana (pooling is
# regression-only; MoCo trunks are unchanged). Crosses the 5 arches with
# attn_pool_queries ∈ {2, 3, 4} → 15 yield trials.
#
# Source arches (val_r2 ranking from productivity_architecture_xavier):
#   trial_034  0.236   128/4/128 drop=0.4
#   trial_024  0.202    64/16/128 drop=0.4
#   trial_031  0.133   128/4/128 drop=0.3
#   trial_004  0.128    64/4/64  drop=0.4
#   trial_008  0.121    96/8/64  drop=0.3
#
# Preview:
#   python run_tuning_study.py show tuning/studies/productivity_top5_moco_parana_attn_pool.yaml --list-trials
#
# Run:
#   python run_tuning_study.py run tuning/studies/productivity_top5_moco_parana_attn_pool.yaml --skip-completed

name: productivity_top5_moco_parana_attn_pool

objective: val_r2

output_dir: ./results/tuning

# Paraná MoCo recipe — arch + feature_layout come from each yield trial.
moco:
  model: transformer
  rc: true
  use_doy: true
  useall: true
  mlp: true
  max_samples: 500000
  epochs: 100
  batchsize: 512
  workers: 8
  sequencelength: 70
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 111
  model_dropout: 0.2
  harvest_years: "2020,2021,2022,2023,2024"
  logdir: ./results

base:
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral_xavier
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 100
  workers: 20
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [10, 75]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  pixel_chunk_size: 8000
  chunks_per_grad: 50
  prefetch_chunks: 30
  auto_chunks_per_grad: true
  auto_chunks_per_grad_min: 1
  auto_chunks_per_grad_vram_frac: 0.95
  auto_chunks_per_grad_vram_target_frac: 0.90
  auto_pixel_chunk_size_min: 3500
  auto_pixel_chunk_size_step: 100
  quiet_training: true
  model_n_layers: 1
  # Learned attention pooling (default in this study).
  temporal_pooling: attention

search:
  strategy: list

  # Order: arch (best→5th) × Q=2,3,4
  trials:
    # --- 128/4/128 drop=0.4 ---
    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 2

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 3

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 4

    # --- 64/16/128 drop=0.4 ---
    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 2

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 3

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      attn_pool_queries: 4

    # --- 128/4/128 drop=0.3 ---
    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      attn_pool_queries: 2

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      attn_pool_queries: 3

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      attn_pool_queries: 4

    # --- 64/4/64 drop=0.4  (trial_004 family) ---
    - model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4
      attn_pool_queries: 2

    - model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4
      attn_pool_queries: 3

    - model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4
      attn_pool_queries: 4

    # --- 96/8/64 drop=0.3 ---
    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.3
      attn_pool_queries: 2

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.3
      attn_pool_queries: 3

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.3
      attn_pool_queries: 4
