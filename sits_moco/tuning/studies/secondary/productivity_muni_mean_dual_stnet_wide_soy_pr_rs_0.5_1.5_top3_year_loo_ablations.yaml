# Modality ablations of the top-3 year-LOO DualSTNet trials
# (productivity_muni_mean_dual_stnet_wide_soy_pr_rs_0.5_1.5_top100_year_loo),
# selected by lowest mean (val_loss + test_loss)/2 across folds.
#
# 3 arches × 6 ablations = 18 trials; each trial runs year LOO 2020–2024.
# Full (S2+climate+soil) baseline is the parent study — not re-run here.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_rs_0.5_1.5_top3_year_loo_ablations.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_rs_0.5_1.5_top3_year_loo_ablations.yaml --skip-completed
#
# Source top-3 (parent trial_id → mean avg loss / test R²):
#   trial_063  mean_avg_loss=0.386662  test_r2=0.4363  lr=0.001 d=128 h=2 i=64 L=1 drop=0.3
#   trial_060  mean_avg_loss=0.392135  test_r2=0.4308  lr=0.001 d=128 h=4 i=128 L=2 drop=0.4
#   trial_047  mean_avg_loss=0.400594  test_r2=0.4203  lr=0.0005 d=128 h=2 i=64 L=1 drop=0.2
name: productivity_muni_mean_dual_stnet_wide_soy_pr_rs_0.5_1.5_top3_year_loo_ablations

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  # default layout overridden per trial
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_wide_soy_pr_rs_0.5_1.5_top3_yloo_abl

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_rs_0.5_1.5_loo{holdout_year}.json
  trials:
    # trial_063 → nosoil (remove soil) · layout=dual_spectral_daily_climate
    - feature_layout: dual_spectral_daily_climate
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_063 → noclimate (remove climate) · layout=spectral_soil
    - feature_layout: spectral_soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_063 → nosentinel (remove sentinel) · layout=dual_daily_climate_soil
    - feature_layout: dual_daily_climate_soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_063 → nosoil_noclimate (remove soil+climate) · layout=spectral
    - feature_layout: spectral
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_063 → nosoil_nosentinel (remove soil+sentinel) · layout=dual_daily_climate
    - feature_layout: dual_daily_climate
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_063 → nosentinel_noclimate (remove sentinel+climate) · layout=soil
    - feature_layout: soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 1
    # trial_060 → nosoil (remove soil) · layout=dual_spectral_daily_climate
    - feature_layout: dual_spectral_daily_climate
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_060 → noclimate (remove climate) · layout=spectral_soil
    - feature_layout: spectral_soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_060 → nosentinel (remove sentinel) · layout=dual_daily_climate_soil
    - feature_layout: dual_daily_climate_soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_060 → nosoil_noclimate (remove soil+climate) · layout=spectral
    - feature_layout: spectral
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_060 → nosoil_nosentinel (remove soil+sentinel) · layout=dual_daily_climate
    - feature_layout: dual_daily_climate
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_060 → nosentinel_noclimate (remove sentinel+climate) · layout=soil
    - feature_layout: soil
      learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 2
    # trial_047 → nosoil (remove soil) · layout=dual_spectral_daily_climate
    - feature_layout: dual_spectral_daily_climate
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
    # trial_047 → noclimate (remove climate) · layout=spectral_soil
    - feature_layout: spectral_soil
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
    # trial_047 → nosentinel (remove sentinel) · layout=dual_daily_climate_soil
    - feature_layout: dual_daily_climate_soil
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
    # trial_047 → nosoil_noclimate (remove soil+climate) · layout=spectral
    - feature_layout: spectral
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
    # trial_047 → nosoil_nosentinel (remove soil+sentinel) · layout=dual_daily_climate
    - feature_layout: dual_daily_climate
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
    # trial_047 → nosentinel_noclimate (remove sentinel+climate) · layout=soil
    - feature_layout: soil
      learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
