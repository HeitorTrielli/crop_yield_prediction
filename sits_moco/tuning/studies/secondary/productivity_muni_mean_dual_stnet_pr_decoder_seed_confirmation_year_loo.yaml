# Five-seed confirmation of legacy vs the leading deep MLP decoder.

name: productivity_muni_mean_dual_stnet_pr_decoder_seed_confirmation_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_pr_decoder_seed_confirm_yloo

  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    - decoder_type: legacy
      seed: 101010
    - decoder_type: legacy
      seed: 202311
    - decoder_type: legacy
      seed: 3407
    - decoder_type: legacy
      seed: 8675309
    - decoder_type: legacy
      seed: 42

    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      seed: 101010
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      seed: 202311
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      seed: 3407
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      seed: 8675309
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      seed: 42
