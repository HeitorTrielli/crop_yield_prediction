# Five-state bakeoff: force intra-estadual ranking (year × IBGE UF).
#
# Baseline = current winner (muni_rank_corr within-year @0.5).
# Contenders = muni_rank_corr_state @ several weights, plus MSE demean within
# (year×state) with optional state-rank aux.
#
# Selection metric = mean within-state Spearman on the holdout year (not pooled R²).
#
# Trunk = five-state trial_044 (d_model=128, n_head=4, d_inner=256, dropout=0.3).
# Decoder = mlp 256,256,128 (same as decoder_muni_rank_wide winner).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_intra_state_bakeoff_year_loo.yaml --list-trials
#   python scripts/parallel_year_loo_study_folds.py tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_intra_state_bakeoff_year_loo.yaml --parallel 2 --workers 2

name: productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_intra_state_bakeoff_year_loo
objective: val_within_state_spearman
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_loss: none
  aux_loss_weight: 0.0
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  mse_within_state_year: false
  suffix_prefix: dual_stnet_gosc_intra_state_bakeoff_yloo

  # five-state trial_044 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

  # PR/five-state muni_rank winner decoder
  decoder_type: mlp
  decoder_hidden_dims: "256,256,128"
  decoder_activation: gelu
  decoder_norm: layer
  decoder_dropout: 0.1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_loo{holdout_year}.json
  trials:
    # A) baseline: within-year rank (rewards inter-state separation)
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5

    # B) within-(year×state) rank at several weights
    - aux_loss: muni_rank_corr_state
      aux_loss_weight: 0.2
    - aux_loss: muni_rank_corr_state
      aux_loss_weight: 0.5
    - aux_loss: muni_rank_corr_state
      aux_loss_weight: 1.0

    # C) demean MSE within year×state (+ optional state-rank)
    - mse_within_state_year: true
      aux_loss: none
      aux_loss_weight: 0.0
    - mse_within_state_year: true
      aux_loss: muni_rank_corr_state
      aux_loss_weight: 0.5
