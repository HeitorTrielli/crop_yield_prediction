# GOSC top100 / trial_044 DualSTNet trunk on the IID 80/20 muni split.
# Pre-decoder/aux baseline (legacy decoder, no aux/recon).
#
# Source: productivity_muni_mean_dual_stnet_wide_soy_pr_rs_sp_go_sc_0.5_1.5_top100_year_loo/trial_044
#   d_model=128, n_head=4, d_inner=256, dropout=0.3, n_layers=1
#   year-LOO mean R² ≈ 0.437
#
# Split: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_trial044_baseline_muni80_20.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_trial044_baseline_muni80_20.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_gosc_trial044_baseline_muni80_20
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  decoder_type: legacy
  suffix_prefix: dual_stnet_gosc_trial044_baseline_muni80_20

  # five-state top100 trial_044 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

search:
  strategy: list
  trials:
    - {}
