# DualSTNet hotspot follow-up to productivity_muni_mean_dual_stnet_wide.
#
# From 880-trial wide analysis (see dual-stnet-wide-hp-effects canvas):
#   - Concentrate: LR≈1e-3, d_model∈{64,128}, dropout≈0.4, d_inner∈{128,256},
#     n_head 2–4, L=1 (hotspot mean test R²≈0.22, max≈0.40).
#   - Avoid: d_model=96, n_head=16, LR≤5e-5.
# This study tightens that region and factorially tests unexplored knobs
# (attention pooling; weight_decay / L=2 as extras). Schedule shortened to
# match observed best epochs (~10–40).
#
# Main grid (all d_model % n_head == 0):
#   3 LR × 4 d_model × 3 d_inner × 3 dropout × 2 n_head × 2 pooling
#   = 432 trials + extras (weight_decay, L=2, attn_pool_queries).
# Mega-pixel runs are fast; overnight-friendly.
#
# Requires climate + soil sidecars under npy_muni_mean (already built).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_hotspot.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_hotspot.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_hotspot

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  # Best epochs in the wide study clustered ~10–40; drop LR earlier.
  schedule: [20, 60]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 12
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  suffix_prefix: dual_stnet_hotspot
  model_n_layers: 1

search:
  strategy: grid

  parameters:
    learning_rate:
      type: choice
      values: [5.0e-4, 1.0e-3, 2.0e-3]

    model_d_model:
      type: choice
      # Skip 96 (weak in wide). Add 48 / 160 around the strong 64 / 128 band.
      values: [48, 64, 128, 160]

    model_d_inner:
      type: choice
      values: [128, 256, 384]

    model_dropout:
      type: choice
      values: [0.35, 0.4, 0.45]

    model_n_head:
      type: choice
      # Skip 16 for now (never reached test R²>0.2 in wide extras).
      values: [2, 4]

    temporal_pooling:
      type: choice
      # Full factorial vs NDVI — only 4 attention corners in the wide study.
      values: [ndvi, attention]

  extra_trials:
    # Weight-decay sweep on the canvas hotspot (LR=1e-3, d∈{64,128}, drop=0.4)
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-4

    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-3

    - learning_rate: 1.0e-3
      model_d_model: 64
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-4

    - learning_rate: 1.0e-3
      model_d_model: 64
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-3

    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: attention
      attn_pool_queries: 4
      weight_decay: 1.0e-4

    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: attention
      attn_pool_queries: 8
      weight_decay: 5.0e-4

    # L=2 ablation on strong arches (main grid is L=1)
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 2
      temporal_pooling: ndvi

    - learning_rate: 1.0e-3
      model_d_model: 64
      model_n_head: 4
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 2
      temporal_pooling: ndvi

    - learning_rate: 2.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 384
      model_dropout: 0.4
      model_n_layers: 2
      temporal_pooling: attention
      attn_pool_queries: 4

    # Replicate wide best (trial_859) under the new schedule / patience
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 5.0e-4

    # Near-miss widths from canvas (48 / 160) × attention at high LR
    - learning_rate: 2.0e-3
      model_d_model: 48
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: attention
      attn_pool_queries: 4

    - learning_rate: 2.0e-3
      model_d_model: 160
      model_n_head: 4
      model_d_inner: 384
      model_dropout: 0.45
      temporal_pooling: attention
      attn_pool_queries: 4
