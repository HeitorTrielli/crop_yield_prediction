# PR-only year-LOO: every non-empty mix of the three climate-trunk changes,
# on each of the five best original trials.
#
# Parents (mean val R²) from
# productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_top100_year_loo:
#   trial_064 0.16865, trial_021 0.16784, trial_068 0.16226,
#   trial_045 0.16124, trial_005 0.15982.
#
# Three climate-trunk changes. Sentinel trunk stays on the parent
# (NDVI pooling, parent width, heads, dropout, depth, learning rate).
#   attention  climate pooling = learned attention (4 queries); otherwise mean
#   extras     dry_spell + soybean growing degree days + daily rain−ETo
#   width      climate d_model and n_head differ from the Sentinel trunk
#              (128-wide parents → 64-d climate trunk with fewer heads;
#               the 64-wide parent → 128-d climate trunk with 4 heads)
#
# 5 parents × 7 mixes = 35 trials. The unchanged parent is already in the
# original year-LOO study, so it is not repeated here.
# 7 mixes: each change alone, each pair, and all three.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_combos_top5_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_combos_top5_year_loo.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_combos_top5_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_wide_soy_pr_0.5_1.5_clim_trunk_combos_yloo

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_climate_timing_loo{holdout_year}.json
  trials:
    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer(s). Mix: attention.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      climate_pooling: attention
      climate_extra_features: none

    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer(s). Mix: extras.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      climate_pooling: mean
      climate_extra_features: "dry_spell,gdd,wb"

    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer(s). Mix: width.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      climate_pooling: mean
      climate_extra_features: none
      climate_d_model: 64
      climate_n_head: 4
      climate_d_inner: 64

    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer(s). Mix: attention+extras.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      climate_pooling: attention
      climate_extra_features: "dry_spell,gdd,wb"

    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer(s). Mix: attention+width.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
