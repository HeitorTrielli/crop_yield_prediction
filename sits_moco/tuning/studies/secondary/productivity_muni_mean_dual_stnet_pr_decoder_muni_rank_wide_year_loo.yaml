# Wider within-year municipality separation loss weights (PR-only).
#
# Follow-up to productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_year_loo,
# where mlp 256,256,128 + muni_rank_corr@0.1 was best (val_r2≈0.176) and cut
# the ~3.7 t/ha ceiling mass. This study pushes aux_loss_weight higher
# (0.2–3.0) on the winning head + the same trunk as trial_005.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_wide_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_wide_year_loo.yaml --skip-completed
#   python run_tuning_study.py summarize tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_wide_year_loo.yaml

name: productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_wide_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  suffix_prefix: dual_stnet_pr_decoder_muni_rank_wide_yloo

  # trial_005 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

  # winning decoder from decoder + muni_rank sweeps
  decoder_type: mlp
  decoder_hidden_dims: "256,256,128"
  decoder_activation: gelu
  decoder_norm: layer
  decoder_dropout: 0.1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # Anchor: previous best weight (reproducibility / compare under this study name).
    - aux_loss: none
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # Wider muni_rank_corr
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.2
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
    - aux_loss: muni_rank_corr
      aux_loss_weight: 1.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 2.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 3.0

    # Wider muni_rank (ordering-only)
    - aux_loss: muni_rank
      aux_loss_weight: 0.2
    - aux_loss: muni_rank
      aux_loss_weight: 0.5
    - aux_loss: muni_rank
      aux_loss_weight: 1.0
    - aux_loss: muni_rank
      aux_loss_weight: 2.0
    - aux_loss: muni_rank
      aux_loss_weight: 3.0

    # Wider muni_corr (Pearson)
    - aux_loss: muni_corr
      aux_loss_weight: 0.5
    - aux_loss: muni_corr
      aux_loss_weight: 1.0
    - aux_loss: muni_corr
      aux_loss_weight: 2.0
    - aux_loss: muni_corr
      aux_loss_weight: 3.0
