# Fixed-architecture modality ablations matched to PR paper MSTNet (trial_005).
#
# Source arch: productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_top100_year_loo/trial_005
#   d_model=128, n_head=4, d_inner=64, dropout=0.4, n_layers=1, lr=1e-3, legacy decoder
#
# Only feature_layout changes:
#   nosoil      → dual_spectral_daily_climate   (drop late soil fusion)
#   noclimate   → spectral_soil                 (drop climate STNet trunk)
#   nosentinel  → dual_daily_climate_soil       (drop spectral STNet trunk)
#
# Full three-stream baseline is the existing PR year-LOO trial_005 checkpoints;
# this study trains the three leave-one-modality variants only.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_trial005_modality_ablations_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_trial005_modality_ablations_year_loo.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_pr_trial005_modality_ablations_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_pr_trial005_modality_abl_yloo
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1
  decoder_type: legacy

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # no soil: dual S2 + climate trunks, no late soil
    - feature_layout: dual_spectral_daily_climate

    # no climate: single S2 STNet + late soil
    - feature_layout: spectral_soil

    # no Sentinel-2: climate STNet only + late soil
    - feature_layout: dual_daily_climate_soil
