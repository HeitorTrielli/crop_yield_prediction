# Within-year municipality separation loss study.
#
# Uses PR-only trial_005 encoders and compares the legacy decoder with the best
# decoder seen in the first decoder sweep (deep GELU MLP). The auxiliary loss
# is computed only among municipalities from the same harvest year in each
# training batch.

name: productivity_muni_mean_dual_stnet_pr_decoder_muni_rank_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  suffix_prefix: dual_stnet_pr_decoder_muni_rank_yloo

  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # Legacy controls and loss weights.
    - decoder_type: legacy
      aux_loss: none
    - decoder_type: legacy
      aux_loss: muni_corr
      aux_loss_weight: 0.01
    - decoder_type: legacy
      aux_loss: muni_corr
      aux_loss_weight: 0.03
    - decoder_type: legacy
      aux_loss: muni_corr
      aux_loss_weight: 0.1
    - decoder_type: legacy
      aux_loss: muni_corr
      aux_loss_weight: 0.3
    - decoder_type: legacy
      aux_loss: muni_rank
      aux_loss_weight: 0.03
    - decoder_type: legacy
      aux_loss: muni_rank
      aux_loss_weight: 0.1
    - decoder_type: legacy
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.03
    - decoder_type: legacy
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # Deep MLP control and the same loss family.
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: none
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_corr
      aux_loss_weight: 0.01
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_corr
      aux_loss_weight: 0.03
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_corr
      aux_loss_weight: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_corr
      aux_loss_weight: 0.3
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_rank
      aux_loss_weight: 0.03
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_rank
      aux_loss_weight: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.03
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1
