# Bake-off: parallel generative recon head + other ceiling alternatives (PR-only).
#
# Trunk = trial_005 DualSTNet; head = mlp 256,256,128 (prior decoder/muni_rank winner).
# Alternatives covered as list trials:
#   - controls (none, muni_rank_corr@0.1)
#   - pooled / sequence recon (λ sweep)
#   - recon + rank
#   - recon stopgrad-encoder ablation
#   - mixture decoder
#   - freeze encoder (decoder-only)
#   - rank-heavy primary
#
# Offline follow-ups (not training trials): embedding→GBT probe on control ckpts.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_recon_bakeoff_year_loo.yaml --list-trials
#   python scripts/parallel_year_loo_study_folds.py tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_recon_bakeoff_year_loo.yaml --parallel 4 --workers 2

name: productivity_muni_mean_dual_stnet_pr_recon_bakeoff_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  recon_mode: none
  recon_loss_weight: 0.0
  recon_stopgrad_encoder: false
  freeze_encoder: false
  suffix_prefix: dual_stnet_pr_recon_bakeoff_yloo

  # trial_005 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

  # winning decoder from prior sweeps
  decoder_type: mlp
  decoder_hidden_dims: "256,256,128"
  decoder_activation: gelu
  decoder_norm: layer
  decoder_dropout: 0.1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # --- controls ---
    - aux_loss: none
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # --- pooled recon λ sweep ---
    - recon_mode: pooled
      recon_loss_weight: 0.1
    - recon_mode: pooled
      recon_loss_weight: 0.5
    - recon_mode: pooled
      recon_loss_weight: 1.0

    # --- sequence recon λ sweep ---
    - recon_mode: sequence
      recon_loss_weight: 0.1
    - recon_mode: sequence
      recon_loss_weight: 0.5
    - recon_mode: sequence
      recon_loss_weight: 1.0

    # --- recon + rank ---
    - recon_mode: pooled
      recon_loss_weight: 0.5
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1
    - recon_mode: sequence
      recon_loss_weight: 0.5
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # --- stopgrad encoder (recon head only; ablation) ---
    - recon_mode: pooled
      recon_loss_weight: 0.5
      recon_stopgrad_encoder: true
    - recon_mode: sequence
      recon_loss_weight: 0.5
      recon_stopgrad_encoder: true

    # --- mixture head ---
    - decoder_type: mixture
      decoder_num_experts: 4
      aux_loss: none
    - decoder_type: mixture
      decoder_num_experts: 4
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # --- freeze encoder (decoder-only) ---
    - freeze_encoder: true
      aux_loss: none
    - freeze_encoder: true
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # --- rank-heavy (ranking as primary signal) ---
    - aux_loss: muni_rank_corr
      aux_loss_weight: 2.0

    # --- combo: sequence recon + rank + mixture ---
    - decoder_type: mixture
      decoder_num_experts: 4
      recon_mode: sequence
      recon_loss_weight: 0.5
      aux_loss: muni_rank_corr
      aux_loss_weight: 0.1
