# DualSTNet on true soy pixels (non-aggregated), top-10 arches from
# productivity_muni_mean_dual_stnet_wide ranked by test_r2 (no MoCo).
#
# Source ranking (wide muni_mean test_r2):
#   trial_859  0.398   128/2/256 L1 drop=0.4 LR=1e-3
#   trial_787  0.382   128/2/128 L1 drop=0.4 LR=1e-3
#   trial_789  0.377   128/4/128 L1 drop=0.4 LR=1e-3
#   trial_499  0.348   128/2/64  L1 drop=0.4 LR=5e-4
#   trial_698  0.343    96/2/64  L2 drop=0.4 LR=1e-3
#   trial_427  0.343   128/2/256 L1 drop=0.4 LR=1e-4
#   trial_753  0.325    64/4/128 L1 drop=0.4 LR=1e-3
#   trial_791  0.322   128/8/128 L1 drop=0.4 LR=1e-3
#   trial_755  0.320    64/8/128 L1 drop=0.4 LR=1e-3
#   trial_650  0.314    32/2/64  L2 drop=0.2 LR=1e-3
#
# Requires under ~/sits_moco_data/npy/{season}/{code}/:
#   {code}.npy, {code}_soil.npy, {code}_climate_daily.npy
# (link climate from npy_muni_mean if needed:
#   bash scripts/link_pixel_climate_from_muni_mean.sh 2020-2021)
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_pixel_dual_stnet_top10_wide.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_pixel_dual_stnet_top10_wide.yaml --skip-completed

name: productivity_pixel_dual_stnet_top10_wide

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean.json
  logdir: ./results
  seed: 101010
  # Pixel epochs are expensive (~millions of soy pixels); match other pixel studies.
  epochs: 100
  workers: 8
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [10, 60]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 5
  checkpoint_every: 0
  pixel_chunk_size: 4096
  chunks_per_grad: 8
  prefetch_chunks: 12
  auto_chunks_per_grad: true
  auto_chunks_per_grad_min: 1
  auto_chunks_per_grad_vram_frac: 0.90
  auto_chunks_per_grad_vram_target_frac: 0.85
  auto_pixel_chunk_size_min: 1024
  auto_pixel_chunk_size_step: 256
  quiet_training: true
  suffix_prefix: dual_stnet_pixel_top10

search:
  strategy: list

  # Same order as wide test_r2 ranking (best → 10th).
  trials:
    # wide trial_859
    - learning_rate: 1.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_787
    - learning_rate: 1.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_789
    - learning_rate: 1.0e-4
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_499
    - learning_rate: 5.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_698
    - learning_rate: 1.0e-4
      model_d_model: 96
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.4
      model_n_layers: 2

    # wide trial_427
    - learning_rate: 1.0e-4
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_753
    - learning_rate: 1.0e-4
      model_d_model: 64
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_791
    - learning_rate: 1.0e-4
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_755
    - learning_rate: 1.0e-4
      model_d_model: 64
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1

    # wide trial_650
    - learning_rate: 1.0e-4
      model_d_model: 32
      model_n_head: 2
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 2
