# Dual STNet on municipal mega-pixels: S2 mean series + raw daily Xavier climate.
#
# Architecture:
#   STNet_S2      (available Sentinel images, 10 bands, sequencelength=45)
#   STNet_climate (daily pr/ETo/Rs/Tmax/Tmin, T=183 Oct–Mar)
#   decoder       concat(s2_emb, climate_emb, soil) → yield
#
# Soil is static (MapBiomas Solo municipal means) and is late-fused into the
# decoder only — it does not go through either transformer.
#
# Build inputs:
#   python preprocessing/aggregate_municipal_npy.py --stat mean -j 8 --overwrite
#   python data_download/build_mapbiomas_solo_sidecars.py --mode muni_mean \
#       --npy-root ~/sits_moco_data/npy_muni_mean --year-range 2020-2021
#   python data_download/build_muni_daily_climate_npy.py \
#       --npy-root ~/sits_moco_data/npy_muni_mean --year-range 2020-2021 \
#       --xavier-pr-nc PATH --xavier-eto-nc PATH --xavier-rs-nc PATH \
#       --xavier-tmax-nc PATH --xavier-tmin-nc PATH
# Repeat the sidecar scripts for each season folder (2019-2020 … 2023-2024).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet.yaml --list-trials
#   python run_tuning_study.py run tuning/studies/secondary/productivity_muni_mean_dual_stnet.yaml --skip-completed

name: productivity_muni_mean_dual_stnet

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-5
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [150, 750]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  model_n_layers: 1
  suffix_prefix: dual_stnet

search:
  strategy: list

  # Same five arches as productivity_muni_mean (no MoCo — climate trunk is new).
  trials:
    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3

    - model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.3
