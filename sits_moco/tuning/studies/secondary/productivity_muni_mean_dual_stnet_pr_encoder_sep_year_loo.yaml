# Force within-year yield separation in the DualSTNet encoder (PR-only).
#
# Motivation (t-SNE trial_005): year clusters are clear, but alto/médio/baixo
# actual mix inside them. This study pressure-tests two auxiliaries:
#   A) stronger within-year muni_rank_corr (already helped a bit at λ=0.2)
#   B) parallel linear yield probe on fused embeddings
#   A+B combo
#
# Trunk/decoder = prior PR winner (mlp 256,256,128).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_encoder_sep_year_loo.yaml --list-trials
#   python scripts/parallel_year_loo_study_folds.py tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_encoder_sep_year_loo.yaml --parallel 4 --workers 2

name: productivity_muni_mean_dual_stnet_pr_encoder_sep_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_loss: none
  aux_loss_weight: 0.0
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  aux_yield_probe: none
  aux_yield_probe_weight: 0.0
  recon_mode: none
  recon_loss_weight: 0.0
  freeze_encoder: false
  suffix_prefix: dual_stnet_pr_encoder_sep_yloo

  # trial_005 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

  # prior decoder winner
  decoder_type: mlp
  decoder_hidden_dims: "256,256,128"
  decoder_activation: gelu
  decoder_norm: layer
  decoder_dropout: 0.1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # --- controls ---
    - aux_loss: none
      aux_yield_probe: none

    # --- A) stronger within-year ranking ---
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.2
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
    - aux_loss: muni_rank_corr
      aux_loss_weight: 1.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 2.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
      aux_rank_min_gap: 0.25

    # --- B) linear yield probe on fused ---
    - aux_yield_probe: linear
      aux_yield_probe_weight: 0.1
    - aux_yield_probe: linear
      aux_yield_probe_weight: 0.5
    - aux_yield_probe: linear
      aux_yield_probe_weight: 1.0
    - aux_yield_probe: linear
      aux_yield_probe_weight: 2.0

    # --- A+B ---
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
      aux_yield_probe: linear
      aux_yield_probe_weight: 0.5
    - aux_loss: muni_rank_corr
      aux_loss_weight: 1.0
      aux_yield_probe: linear
      aux_yield_probe_weight: 1.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
      aux_rank_min_gap: 0.25
      aux_yield_probe: linear
      aux_yield_probe_weight: 0.5
