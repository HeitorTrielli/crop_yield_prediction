# DualSTNet mega-pixel + dual MoCo, retargeted to the wide-study hotspot.
#
# Replaces the earlier moco grid (which still included d_model=96 / n_head=8/16).
# From the wide analysis hotspot (LR≈1e-3, d_model∈{64,128}, dropout≈0.4):
#   concentrate MoCo finetune there and add attention / weight_decay / LR=2e-3.
#
# Each unique (d_model, n_head, d_inner, L) trains / reuses TWO MoCo trunks:
#   moco.spectral  → pixel S2 (feature_layout=spectral)
#   moco.climate   → municipal daily Xavier (daily_climate)
#
# Unique MoCo arches ≈ 2×2×2 = 8 → up to 16 MoCo trunks; yield ≈ 72 + extras.
#
# Requires:
#   - ~/sits_moco_data/npy (pixel) for spectral MoCo
#   - climate + soil sidecars under npy_muni_mean
#   - files/train_input_scaler_dual_muni_mean.json
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_moco.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_moco.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_moco

objective: val_r2

output_dir: ./results/tuning

moco:
  model: transformer
  rc: true
  use_doy: true
  useall: true
  mlp: true
  epochs: 100
  workers: 8
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 111
  model_dropout: 0.2
  harvest_years: "2020,2021,2022,2023,2024"
  logdir: ./results

  spectral:
    feature_layout: spectral
    datapath: ~/sits_moco_data/npy
    sequencelength: 70
    batchsize: 512
    max_samples: 500000

  climate:
    feature_layout: daily_climate
    datapath: ~/sits_moco_data/npy_muni_mean
    sequencelength: 183
    batchsize: 64
    max_samples: 10000
    extra_scaler: files/train_input_scaler_dual_muni_mean.json

base:
  datapath: ~/sits_moco_data/npy_muni_mean
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [20, 60]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 12
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  suffix_prefix: dual_stnet_moco
  model_n_layers: 1

search:
  strategy: grid

  parameters:
    learning_rate:
      type: choice
      values: [5.0e-4, 1.0e-3, 2.0e-3]

    model_d_model:
      type: choice
      values: [64, 128]

    model_n_head:
      type: choice
      values: [2, 4]

    model_d_inner:
      type: choice
      values: [128, 256]

    model_dropout:
      type: choice
      values: [0.4, 0.45]

    temporal_pooling:
      type: choice
      values: [ndvi, attention]

  extra_trials:
    # Weight-decay around trial_859-like arch
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-4

    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: ndvi
      weight_decay: 1.0e-3

    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      temporal_pooling: attention
      attn_pool_queries: 8
      weight_decay: 1.0e-4

    # L=2 ablation (extra MoCo trunk fingerprint)
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 2
      temporal_pooling: ndvi

    - learning_rate: 2.0e-3
      model_d_model: 64
      model_n_head: 4
      model_d_inner: 256
      model_dropout: 0.45
      model_n_layers: 2
      temporal_pooling: attention
      attn_pool_queries: 4
