# Best pre-decoder/aux five-state model on the IID 80/20 muni split.
#
# Source: climate_trunk_alldata_year_loo / trial_009
#   = five-state trial_044 spectral trunk (128/4/256, dropout 0.3)
#   + climate attention pooling + extras (dry_spell,gdd,wb) + climate width 64/2/64
#   year-LOO mean R² ≈ 0.470 (best before heads/aux bakeoff)
#
# Split: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_climate_trunk_best_muni80_20.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_climate_trunk_best_muni80_20.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_gosc_climate_trunk_best_muni80_20
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  decoder_type: legacy
  suffix_prefix: dual_stnet_gosc_climate_trunk_best_muni80_20

  # spectral trunk = five-state trial_044
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

  # climate trunk changes from trial_009
  climate_pooling: attention
  climate_extra_features: "dry_spell,gdd,wb"
  climate_d_model: 64
  climate_n_head: 2
  climate_d_inner: 64

search:
  strategy: list
  trials:
    - {}
