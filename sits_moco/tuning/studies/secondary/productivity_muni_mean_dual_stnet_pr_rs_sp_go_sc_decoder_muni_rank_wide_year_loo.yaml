# Five-state (PR+RS+SP+GO+SC) decoder + wide within-year ranking aux.
#
# Trunk = best five-state year-LOO DualSTNet from
# productivity_muni_mean_dual_stnet_wide_soy_pr_rs_sp_go_sc_0.5_1.5_top100_year_loo
# (trial_044: spectral 128/4/256, dropout 0.3).
# Head = mlp 256,256,128 (PR decoder/muni_rank winner) with wider aux weights.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_decoder_muni_rank_wide_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_decoder_muni_rank_wide_year_loo.yaml --skip-completed
#   python run_tuning_study.py summarize tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_decoder_muni_rank_wide_year_loo.yaml

name: productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_decoder_muni_rank_wide_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  suffix_prefix: dual_stnet_gosc_decoder_muni_rank_wide_yloo

  # five-state trial_044 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

  # PR muni_rank winner decoder
  decoder_type: mlp
  decoder_hidden_dims: "256,256,128"
  decoder_activation: gelu
  decoder_norm: layer
  decoder_dropout: 0.1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_loo{holdout_year}.json
  trials:
    # Controls
    - aux_loss: none
    - decoder_type: legacy
      aux_loss: none

    # Known-good PR weight on five-state data
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.1

    # Wider muni_rank_corr
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.2
    - aux_loss: muni_rank_corr
      aux_loss_weight: 0.5
    - aux_loss: muni_rank_corr
      aux_loss_weight: 1.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 2.0
    - aux_loss: muni_rank_corr
      aux_loss_weight: 3.0

    # Wider muni_rank
    - aux_loss: muni_rank
      aux_loss_weight: 0.2
    - aux_loss: muni_rank
      aux_loss_weight: 0.5
    - aux_loss: muni_rank
      aux_loss_weight: 1.0
    - aux_loss: muni_rank
      aux_loss_weight: 2.0
    - aux_loss: muni_rank
      aux_loss_weight: 3.0

    # Wider muni_corr
    - aux_loss: muni_corr
      aux_loss_weight: 0.5
    - aux_loss: muni_corr
      aux_loss_weight: 1.0
    - aux_loss: muni_corr
      aux_loss_weight: 2.0
    - aux_loss: muni_corr
      aux_loss_weight: 3.0
