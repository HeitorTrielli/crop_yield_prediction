# SC DualSTNet top-100, coverage 0.5–1.5, year leave-one-out CV
#
# Year leave-one-out CV over harvest years 2020–2024 for the same top-100
# DualSTNet arches as productivity_muni_mean_dual_stnet_wide_soy_pr_rs_0.5_1.5_top100.
# Each trial runs 5 folds; objective is mean val_r2 across folds.
# Fold Y trains on all other years; valid=test=year Y (CSV split ignored).
# Input scaler is refit per fold onto that fold's train years.
#
# Coverage: MapBiomas/IBGE [0.5, 1.5].
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_sc_0.5_1.5_top100_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_sc_0.5_1.5_top100_year_loo.yaml --skip-completed
#   python run_tuning_study.py summarize tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_sc_0.5_1.5_top100_year_loo.yaml

name: productivity_muni_mean_dual_stnet_wide_soy_sc_0.5_1.5_top100_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_sc_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_wide_soy_sc_0.5_1.5_top100_yloo

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_sc_0.5_1.5_loo{holdout_year}.json
  trials:
    # source trial_861 val_r2=0.4690
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 256
      model_dropout: 0.4
      model_n_layers: 1

