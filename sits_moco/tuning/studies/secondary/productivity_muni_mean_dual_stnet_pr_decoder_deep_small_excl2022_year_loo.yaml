# Decoder study optimized for the in-distribution years.
#
# 2022 is omitted from the LOO objective because it is a distinct distribution,
# but remains available in the training years for the other four folds.

name: productivity_muni_mean_dual_stnet_pr_decoder_deep_small_excl2022_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_pr_decoder_deep_small_ex22_yloo

  model_d_model: 128
  model_n_head: 4
  model_d_inner: 64
  model_dropout: 0.4
  model_n_layers: 1

search:
  strategy: list
  year_loo: [2020, 2021, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # Existing controls.
    - decoder_type: legacy
    - decoder_type: mlp
      decoder_hidden_dims: "64,32"
      decoder_activation: relu
      decoder_norm: layer
      decoder_dropout: 0.4

    # Add depth while keeping parameter count modest.
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,32"
      decoder_activation: relu
      decoder_norm: layer
      decoder_dropout: 0.3
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.2
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: relu
      decoder_norm: layer
      decoder_dropout: 0.3
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.2
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "48,48,48,24"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "32,32,32,16"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1

    # Tapered narrow networks.
    - decoder_type: mlp
      decoder_hidden_dims: "96,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "96,96,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "128,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "128,96,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "128,128,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "128,96,64,32,16"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1

    # Regularization and activation around the strongest narrow/deep shape.
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.0
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.05
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.3
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: none
      decoder_dropout: 0.1
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: silu
      decoder_norm: layer
      decoder_dropout: 0.1

    # Narrow residual networks; each listed width contributes a two-linear block.
    - decoder_type: residual
      decoder_hidden_dims: "64,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: residual
      decoder_hidden_dims: "64,64,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: residual
      decoder_hidden_dims: "64,64,64,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: residual
      decoder_hidden_dims: "96,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
    - decoder_type: residual
      decoder_hidden_dims: "128,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1

    # Small local experts and modality interaction heads.
    - decoder_type: mixture
      decoder_hidden_dims: "64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      decoder_num_experts: 3
    - decoder_type: mixture
      decoder_hidden_dims: "64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      decoder_num_experts: 3
    - decoder_type: modality_residual
      decoder_hidden_dims: "64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
