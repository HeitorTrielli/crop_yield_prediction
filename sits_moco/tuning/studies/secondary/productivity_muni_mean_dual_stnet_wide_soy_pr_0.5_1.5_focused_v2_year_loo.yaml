# Focused follow-up to the completed PR-only top-100 year-LOO study.
#
# Top-10 evidence:
#   - 9/10 use the previous maximum LR (1e-3)
#   - 6/10 use the previous maximum d_model (128)
#   - 5/10 use the previous maximum n_head (8), which also has the best marginal mean
#   - both L=1 and L=2 remain competitive
# Fixed training knobs (weight decay, batch size, schedule and sequence length)
# were not explored in the original PR-only LOO study.
#
# Run:
#   python run_tuning_study.py run tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_focused_v2_year_loo.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_focused_v2_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_soy_pr_focused_v2_yloo

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_loo{holdout_year}.json
  trials:
    # Control: previous winner (trial_064).
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}

    # LR boundary sweep.
    - {learning_rate: 1.25e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.5e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 2.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 3.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}

    # Finer dropout sweep around the 0.2–0.4 top-10 band.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.1, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.2, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.25, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.35, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.4, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.5, model_n_layers: 1}

    # Head-count boundary and depth.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 4, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 16, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 2}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 3}

    # Feed-forward width around the winning 128.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 64, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 256, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 384, model_dropout: 0.3, model_n_layers: 1}

    # Weight decay was fixed at 5e-4.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, weight_decay: 0.0}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, weight_decay: 1.0e-4}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, weight_decay: 1.0e-3}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, weight_decay: 2.0e-3}

    # Earlier schedules; mean stopping epoch was about 30.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, schedule: [10, 30], early_stop_patience: 20}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, schedule: [20, 60], early_stop_patience: 20}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, schedule: [30, 90], early_stop_patience: 20}

    # Batch size and spectral sequence length were fixed.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, batchsize: 20}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, batchsize: 80}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, batchsize: 128}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, sequencelength: 30}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, sequencelength: 60}

    # Width beyond the previous d_model=128 boundary.
    - {learning_rate: 1.5e-3, model_d_model: 160, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.5e-3, model_d_model: 192, model_n_head: 8, model_d_inner: 192, model_dropout: 0.3, model_n_layers: 1}
    - {learning_rate: 1.5e-3, model_d_model: 256, model_n_head: 16, model_d_inner: 256, model_dropout: 0.3, model_n_layers: 1}

    # Promising alternative top-10 families at a higher LR.
    - {learning_rate: 1.5e-3, model_d_model: 64, model_n_head: 8, model_d_inner: 128, model_dropout: 0.2, model_n_layers: 2}
    - {learning_rate: 1.5e-3, model_d_model: 128, model_n_head: 4, model_d_inner: 64, model_dropout: 0.2, model_n_layers: 1}
    - {learning_rate: 1.5e-3, model_d_model: 64, model_n_head: 4, model_d_inner: 256, model_dropout: 0.3, model_n_layers: 2}

    # Attention pooling was nearly absent from the prior LOO list.
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, temporal_pooling: attention, attn_pool_queries: 4}
    - {learning_rate: 1.0e-3, model_d_model: 128, model_n_head: 8, model_d_inner: 128, model_dropout: 0.3, model_n_layers: 1, temporal_pooling: attention, attn_pool_queries: 8}
