# Transfer top-5 PR mega-bakeoff heads to five-state (PR+RS+SP+GO+SC) year-LOO.
#
# Source: productivity_muni_mean_dual_stnet_pr_heads_mega_bakeoff_year_loo
#   (713/713 complete). Ranking by mean holdout R² over 2020–2024.
#   2022 is expected-weak on PR (sole drought year); still included in LOO.
#
# trial_001 = PR mega 223  gated[128,64] + muni_supcon@0.5 + recon seq@0.5  (mean≈0.234, ex22≈0.301)
# trial_002 = PR mega 292  dense[64,64,64] + recon seq@0.5                 (mean≈0.234, ex22≈0.235)
# trial_003 = PR mega 217  gated[128,64] + recon seq@0.5                   (mean≈0.233, ex22≈0.295)
# trial_004 = PR mega 173  residual[128,64,32] + muni_supcon@0.5 + recon   (mean≈0.227, ex22≈0.241)
# trial_005 = PR mega 601  ensemble[128,64]                                (mean≈0.207, ex22≈0.280)
#
# Trunk = five-state trial_044 (d_model=128, n_head=4, d_inner=256, dropout=0.3).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_heads_mega_top5_year_loo.yaml --list-trials
#   python scripts/parallel_year_loo_study_folds.py tuning/studies/secondary/productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_heads_mega_top5_year_loo.yaml --parallel 2 --workers 2

name: productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_heads_mega_top5_year_loo
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_loss: none
  aux_loss_weight: 0.0
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  aux_yield_probe: none
  aux_yield_probe_weight: 0.0
  aux_embed_loss: none
  aux_embed_loss_weight: 0.0
  aux_embed_temperature: 0.2
  aux_embed_bins: 3
  recon_mode: none
  recon_loss_weight: 0.0
  freeze_encoder: false
  suffix_prefix: dual_stnet_gosc_heads_mega_top5_yloo

  # five-state trial_044 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_loo{holdout_year}.json
  trials:
    # PR mega trial_223 — best all5 + best excl-2022
    - decoder_type: gated
      decoder_hidden_dims: "128,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_embed_loss: muni_supcon
      aux_embed_loss_weight: 0.5
      recon_mode: sequence
      recon_loss_weight: 0.5

    # PR mega trial_292
    - decoder_type: dense
      decoder_hidden_dims: "64,64,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      recon_mode: sequence
      recon_loss_weight: 0.5

    # PR mega trial_217
    - decoder_type: gated
      decoder_hidden_dims: "128,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      recon_mode: sequence
      recon_loss_weight: 0.5

    # PR mega trial_173
    - decoder_type: residual
      decoder_hidden_dims: "128,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_embed_loss: muni_supcon
      aux_embed_loss_weight: 0.5
      recon_mode: sequence
      recon_loss_weight: 0.5

    # PR mega trial_601
    - decoder_type: ensemble
      decoder_hidden_dims: "128,64"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      decoder_num_experts: 3
