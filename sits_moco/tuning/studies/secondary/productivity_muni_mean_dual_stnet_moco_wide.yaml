# DualSTNet mega-pixel + dual MoCo, same search grid as dual_stnet_wide (~880 trials).
#
# Separate from productivity_muni_mean_dual_stnet_moco (hotspot ~101 trials) so
# existing --skip-completed progress there is not remapped.
#
# Each unique (d_model, n_head, d_inner, L) trains / reuses TWO MoCo trunks:
#   moco.spectral  → pixel S2 (feature_layout=spectral)
#   moco.climate   → municipal daily Xavier (daily_climate)
#
# Unique MoCo arches from grid: 4×3×3×2 = 72 → up to 144 MoCo trunks
# (+ a few n_head=16 extras). Yield grid = 864 + 16 extras ≈ 880.
#
# Requires:
#   - ~/sits_moco_data/npy (pixel) for spectral MoCo
#   - climate + soil sidecars under npy_muni_mean
#   - files/train_input_scaler_dual_muni_mean.json
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_moco_wide.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_moco_wide.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_moco_wide

objective: val_r2

output_dir: ./results/tuning

moco:
  model: transformer
  rc: true
  use_doy: true
  useall: true
  mlp: true
  epochs: 100
  workers: 8
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 111
  model_dropout: 0.2
  harvest_years: "2020,2021,2022,2023,2024"
  logdir: ./results

  spectral:
    feature_layout: spectral
    datapath: ~/sits_moco_data/npy
    sequencelength: 70
    batchsize: 512
    max_samples: 500000

  climate:
    feature_layout: daily_climate
    datapath: ~/sits_moco_data/npy_muni_mean
    sequencelength: 183
    batchsize: 64
    max_samples: 10000
    extra_scaler: files/train_input_scaler_dual_muni_mean.json

base:
  datapath: ~/sits_moco_data/npy_muni_mean
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  suffix_prefix: dual_stnet_moco_wide

search:
  strategy: grid

  parameters:
    model_d_model:
      type: choice
      values: [32, 64, 96, 128]

    model_n_head:
      type: choice
      # Must divide every d_model above (skip 16 here; see extra_trials).
      values: [2, 4, 8]

    model_d_inner:
      type: choice
      values: [64, 128, 256]

    model_dropout:
      type: choice
      values: [0.2, 0.3, 0.4]

    learning_rate:
      type: choice
      values: [5.0e-5, 1.0e-4, 5.0e-4, 1.0e-3]

    model_n_layers:
      type: choice
      values: [1, 2]

  # Corners that are awkward in the full grid (n_head=16, attention pooling).
  extra_trials:
    # Replicate smoke winner × higher LRs
    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 5.0e-5

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 1.0e-4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 5.0e-4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 1.0e-3

    - model_d_model: 128
      model_n_head: 16
      model_d_inner: 256
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 1.0e-4

    - model_d_model: 128
      model_n_head: 16
      model_d_inner: 256
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 5.0e-4

    - model_d_model: 128
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.2
      model_n_layers: 2
      learning_rate: 5.0e-4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 64
      model_dropout: 0.3
      model_n_layers: 2
      learning_rate: 5.0e-4

    # Attention pooling (climate trunk follows when spectral uses attention)
    - model_d_model: 64
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 5.0e-4
      temporal_pooling: attention
      attn_pool_queries: 4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 5.0e-4
      temporal_pooling: attention
      attn_pool_queries: 4

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 1.0e-4
      temporal_pooling: attention
      attn_pool_queries: 4

    - model_d_model: 128
      model_n_head: 8
      model_d_inner: 256
      model_dropout: 0.2
      model_n_layers: 2
      learning_rate: 5.0e-4
      temporal_pooling: attention
      attn_pool_queries: 8

    # Weight-decay ablations around a strong arch corner
    - model_d_model: 64
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 5.0e-4
      weight_decay: 1.0e-4

    - model_d_model: 64
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      learning_rate: 5.0e-4
      weight_decay: 1.0e-3

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      learning_rate: 5.0e-4
      weight_decay: 1.0e-4

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 256
      model_dropout: 0.2
      model_n_layers: 1
      learning_rate: 1.0e-3
      weight_decay: 1.0e-4
