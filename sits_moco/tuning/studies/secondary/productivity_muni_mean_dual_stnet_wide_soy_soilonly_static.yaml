# Corrected soil-only modality ablation.
#
# Replaces the original nosentinel_noclimate soil-only run, which broadcast
# soil across the Sentinel timeline and unintentionally exposed Sentinel DOY,
# acquisition count, and padding masks. This study uses the same top-100
# wide_soy hyperparameters, but passes one static soil token directly through
# an MLP regression head (no temporal encoder or Sentinel metadata).
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_soilonly_static.yaml --list-trials
#   python run_tuning_study.py run tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_soilonly_static.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_wide_soy_soilonly_static
objective: val_r2
output_dir: ./results/tuning
base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: soil
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean_soy.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 0.0005
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule:
  - 40
  - 120
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  suffix_prefix: dual_stnet_wide_soy_soilonly_static
  soil_fusion: early
search:
  strategy: list
  trials:
  - learning_rate: 0.001
    model_d_model: 128
    model_n_head: 2
    model_d_inner: 256
    model_dropout: 0.4
    model_n_layers: 1
  - learning_rate: 0.001
    model_d_model: 128
    model_n_head: 4
    model_d_inner: 64
