    - learning_rate: 0.001
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      batchsize: 40
      sequencelength: 45
      yield_csv: files/pam_soy_pr_rs_sp_go_mapbiomas_coverage_0.5_1.5.csv
