# PR-only year-LOO of the five best dual-STNet trials, with climate-trunk changes.
#
# Parents (mean val R², status ok) from
# productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_top100_year_loo:
#   trial_064 0.1687, trial_021 0.1678, trial_068 0.1623,
#   trial_045 0.1612, trial_005 0.1598.
#
# Sentinel trunk keeps each parent's width, heads, dropout, depth, and NDVI pooling.
# Every trial switches only the climate trunk to attention pooling (4 queries).
# Climate width / heads / feed-forward size are set per trial.
# Extra columns are derived from the raw daily sidecar and appended to that trunk:
#   dry_spell  running days with rain < 1 mm (a missing day freezes the streak)
#   gdd        soybean growing degree days, base 10°C, Tmax capped at 30°C,
#              summed from Oct 1 (somatório de graus-dia)
#   wb         that day's rain minus evapotranspiration
#
# Scaler JSON is separate so --refit-extra-scaler does not overwrite the
# shared PR year-LOO scalers. The refit stores daily_climate_derived stats.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_top5_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_top5_year_loo.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_wide_soy_pr_0.5_1.5_climate_trunk_top5_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  climate_pooling: attention
  attn_pool_queries: 4
  climate_extra_features: "dry_spell,gdd,wb"
  yield_csv: files/pam_soy_pr_mapbiomas_coverage_0.5_1.5.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_wide_soy_pr_0.5_1.5_clim_trunk_top5_yloo

search:
  strategy: list
  year_loo: [2020, 2021, 2022, 2023, 2024]
  extra_scaler_template: files/train_input_scaler_dual_muni_mean_soy_pr_0.5_1.5_climate_timing_loo{holdout_year}.json
  trials:
    # parent trial_064 obj=0.16865. Spectral 128/8/128, dropout 0.3, 1 layer.
    # Climate trunk same width, 4 heads. All three extras.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      model_n_layers: 1
      climate_d_model: 128
      climate_n_head: 4
      climate_d_inner: 128

    # parent trial_021 obj=0.16784. Spectral 128/8/128, dropout 0.4, 1 layer.
    # Narrower climate trunk. Dry spell only.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.4
      model_n_layers: 1
      climate_d_model: 64
      climate_n_head: 4
      climate_d_inner: 64
      climate_extra_features: dry_spell

    # parent trial_068 obj=0.16226. Spectral 64/8/128, dropout 0.2, 2 layers, lr 5e-4.
    # Climate trunk wider than the Sentinel trunk. Growing degree days only.
    - learning_rate: 5.0e-4
      model_d_model: 64
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.2
      model_n_layers: 2
      climate_d_model: 128
      climate_n_head: 8
      climate_d_inner: 128
      climate_extra_features: gdd

    # parent trial_045 obj=0.16124. Spectral 128/4/64, dropout 0.2, 1 layer.
    # Wide climate trunk. Rain minus evapotranspiration only.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.2
      model_n_layers: 1
      climate_d_model: 256
      climate_n_head: 8
      climate_d_inner: 256
      climate_extra_features: wb

    # parent trial_005 obj=0.15982. Spectral 128/4/64, dropout 0.4, 1 layer.
    # Small climate trunk. All three extras.
    - learning_rate: 1.0e-3
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4
      model_n_layers: 1
      climate_d_model: 32
      climate_n_head: 4
      climate_d_inner: 64
