# Top-5 GOSC mega-bakeoff heads, random 80/20 municipality split (IID ceiling).
#
# Source ranking (year-LOO mean R², all5) from
#   productivity_muni_mean_dual_stnet_pr_rs_sp_go_sc_heads_mega_bakeoff_year_loo / partial_rank.csv
#   (snapshot while bakeoff still running; top among ranked trials).
#
# trial_001 = GOSC mega 142  mlp[64,64,64,32] + recon seq@0.5                 (mean≈0.482)
# trial_002 = GOSC mega 148  mlp[64,64,64,32] + muni_supcon@0.5 + recon       (mean≈0.473)
# trial_003 = GOSC mega 023  legacy + muni_supcon@0.5 + recon                 (mean≈0.472)
# trial_004 = GOSC mega 098  mlp[256,256,128] + muni_supcon@0.5 + recon       (mean≈0.469)
# trial_005 = GOSC mega 017  legacy + recon seq@0.5                           (mean≈0.468)
#
# Split: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
#   80% munis → train (all years 2020–2024)
#   20% munis → holdout used as both valid and test (all years)
#   Same municipality never crosses the split.
#
# Trunk = five-state trial_044 (d_model=128, n_head=4, d_inner=256, dropout=0.3).
#
# Preview / run:
#   python scripts/make_muni_random_split_csv.py \
#     --yield-csv files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv \
#     --output files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_heads_mega_top5_muni80_20.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_gosc_heads_mega_top5_muni80_20.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_gosc_heads_mega_top5_muni80_20
objective: val_r2
output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  head_output: zscore
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5_muni80_20.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-3
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  aux_loss: none
  aux_loss_weight: 0.0
  aux_min_munis: 3
  aux_rank_temperature: 0.5
  aux_rank_min_gap: 0.1
  aux_yield_probe: none
  aux_yield_probe_weight: 0.0
  aux_embed_loss: none
  aux_embed_loss_weight: 0.0
  aux_embed_temperature: 0.2
  aux_embed_bins: 3
  recon_mode: none
  recon_loss_weight: 0.0
  recon_stopgrad_encoder: false
  freeze_encoder: false
  suffix_prefix: dual_stnet_gosc_heads_mega_top5_muni80_20

  # five-state trial_044 trunk
  model_d_model: 128
  model_n_head: 4
  model_d_inner: 256
  model_dropout: 0.3
  model_n_layers: 1

search:
  strategy: list
  trials:
    # GOSC mega trial_142
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      recon_mode: sequence
      recon_loss_weight: 0.5

    # GOSC mega trial_148
    - decoder_type: mlp
      decoder_hidden_dims: "64,64,64,32"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_embed_loss: muni_supcon
      aux_embed_loss_weight: 0.5
      recon_mode: sequence
      recon_loss_weight: 0.5

    # GOSC mega trial_023
    - decoder_type: legacy
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_embed_loss: muni_supcon
      aux_embed_loss_weight: 0.5
      recon_mode: sequence
      recon_loss_weight: 0.5

    # GOSC mega trial_098
    - decoder_type: mlp
      decoder_hidden_dims: "256,256,128"
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      aux_embed_loss: muni_supcon
      aux_embed_loss_weight: 0.5
      recon_mode: sequence
      recon_loss_weight: 0.5

    # GOSC mega trial_017
    - decoder_type: legacy
      decoder_activation: gelu
      decoder_norm: layer
      decoder_dropout: 0.1
      recon_mode: sequence
      recon_loss_weight: 0.5
