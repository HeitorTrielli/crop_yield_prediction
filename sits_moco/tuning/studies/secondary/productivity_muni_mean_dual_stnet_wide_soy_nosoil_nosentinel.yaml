# Modality ablation of productivity_muni_mean_dual_stnet_wide_soy:
# remove soil+sentinel.
#
# Daily Xavier climate trunk only (Sentinel encoder off, no soil).
#
# Top-100 arches by avg(val_r2, test_r2) from wide_soy (same order).
# Source range: avg R² 0.2873 … 0.4042
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_nosoil_nosentinel.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_nosoil_nosentinel.yaml --skip-completed

# Source top-10 (wide_soy trial_id → avg R²):
#   trial_859  avg=0.4042  val=0.4382  test=0.3701
#   trial_717  avg=0.3993  val=0.4512  test=0.3474
#   trial_715  avg=0.3964  val=0.4687  test=0.3241
#   trial_573  avg=0.3877  val=0.4495  test=0.3260
#   trial_502  avg=0.3784  val=0.4442  test=0.3126
#   trial_861  avg=0.3771  val=0.4690  test=0.2852
#   trial_694  avg=0.3757  val=0.4445  test=0.3070
#   trial_857  avg=0.3740  val=0.4579  test=0.2900
#   trial_787  avg=0.3695  val=0.4276  test=0.3114
#   trial_823  avg=0.3517  val=0.3949  test=0.3086
name: productivity_muni_mean_dual_stnet_wide_soy_nosoil_nosentinel
objective: val_r2
output_dir: ./results/tuning
base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_daily_climate
  climate_sequencelength: 183
  temporal_pooling: ndvi
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  extra_scaler: files/train_input_scaler_dual_muni_mean_soy.json
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 0.0005
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule:
  - 40
  - 120
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  suffix_prefix: dual_stnet_wide_soy_climonly
search:
  strategy: list
  trials:
  - learning_rate: 0.001
    model_d_model: 128
    model_n_head: 2
    model_d_inner: 256
    model_dropout: 0.4
    model_n_layers: 1
