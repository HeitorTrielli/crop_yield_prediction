# Climate-trunk mixes on all five states (PR+RS+SP+GO+SC).
#
# The best climate-trunk trial so far (mean val R² 0.480) was the PR+RS+SP
# focused trial_020 trunk with all three climate changes. That run drops
# Goiás and Santa Catarina. These trials keep that trunk, and the best
# five-state trunks, and train them on the full five-state yield file.
#
# Climate changes, Sentinel trunk unchanged:
#   attention  learned attention pooling (4 queries); otherwise mean
#   extras     dry spell, soybean growing degree days, daily rain−ETo
#   width      climate width and head count differ from the Sentinel trunk
#
# Scaler files are separate from the original five-state year-LOO scalers.
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_rs_sp_go_sc_climate_trunk_alldata_year_loo.yaml --list-trials
#   python run_tuning_study.py run  tuning/studies/secondary/productivity_muni_mean_dual_stnet_wide_soy_pr_rs_sp_go_sc_climate_trunk_alldata_year_loo.yaml --skip-completed

name: productivity_muni_mean_dual_stnet_wide_soy_pr_rs_sp_go_sc_climate_trunk_alldata_year_loo

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_mean_soy
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: dual_spectral_daily_climate_soil
  soil_fusion: late
  climate_sequencelength: 183
  temporal_pooling: ndvi
  attn_pool_queries: 4
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [40, 120]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 15
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  refit_extra_scaler: true
  suffix_prefix: dual_stnet_wide_soy_gosc_clim_alldata_yloo

search:
  strategy: list
  trials:
    # Winning PR+RS+SP focused trial_020 trunk on five-state data. Spectral 128/2/128, dropout 0.2, batch 128. Mix: attention.
    - learning_rate: 0.001
      model_d_model: 128
      model_n_head: 2
      model_d_inner: 128
      model_dropout: 0.2
      model_n_layers: 1
      batchsize: 128
      sequencelength: 45
      yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv
      climate_pooling: attention
      climate_extra_features: none
      year_loo_folds:
        - holdout_year: 2020
          extra_scaler: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_climate_timing_loo2020.json
        - holdout_year: 2021
          extra_scaler: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_climate_timing_loo2021.json
        - holdout_year: 2022
          extra_scaler: files/train_input_scaler_dual_muni_mean_soy_pr_rs_sp_go_sc_0.5_1.5_climate_timing_loo2022.json
