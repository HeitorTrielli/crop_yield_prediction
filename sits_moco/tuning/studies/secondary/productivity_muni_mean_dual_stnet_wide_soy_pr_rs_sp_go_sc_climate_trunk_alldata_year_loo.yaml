      model_d_model: 128
      model_n_head: 2
      model_d_inner: 128
      model_dropout: 0.2
      model_n_layers: 1
      batchsize: 128
      sequencelength: 45
      yield_csv: files/pam_soy_pr_rs_sp_go_sc_mapbiomas_coverage_0.5_1.5.csv
      climate_pooling: mean
      climate_extra_features: "dry_spell,gdd,wb"
