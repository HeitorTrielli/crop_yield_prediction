# Soil sidecar yield + MoCo encoder init on the FULL soil layout
# (spectral_xavier_climate_soil → STNet / MoCo input_dim=20).
#
# Same yield grid as productivity_soil_sidecar (48 early + 8 late fusion).
# MoCo trains (or reuses) a matching Paraná trunk per unique arch with all
# channels including MapBiomas Solo sidecars ({code}_soil.npy joined into the
# MoCo cache). Requires soil sidecars under SITS_MOCO_DATAPATH.
#
# Unique arches (d_model × n_head × d_inner, L=1) → up to 12 MoCo trunks
# (dropout is not part of the MoCo fingerprint).
#
# Preview:
#   python run_tuning_study.py show tuning/studies/productivity_soil_sidecar_moco.yaml --list-trials
#
# Run:
#   python run_tuning_study.py run tuning/studies/productivity_soil_sidecar_moco.yaml --skip-completed

name: productivity_soil_sidecar_moco

objective: val_r2

output_dir: ./results/tuning

# Full soil MoCo (20 inputs). Arch + feature_layout come from each yield trial.
moco:
  model: transformer
  rc: true
  use_doy: true
  useall: true
  mlp: true
  max_samples: 500000
  epochs: 100
  batchsize: 512
  workers: 8
  sequencelength: 70
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  seed: 111
  model_dropout: 0.2
  harvest_years: "2020,2021,2022,2023,2024"
  logdir: ./results

base:
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral_xavier_climate_soil
  soil_fusion: early
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 100
  # Same memory posture as productivity_soil_sidecar (soil + C=20 is heavy).
  workers: 4
  sequencelength: 45
  batchsize: 40
  weight_decay: 2.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [20, 75]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  pixel_chunk_size: 6500
  chunks_per_grad: 12
  prefetch_chunks: 4
  dataloader_prefetch_factor: 2
  auto_chunks_per_grad: true
  auto_chunks_per_grad_min: 1
  auto_chunks_per_grad_vram_frac: 0.90
  auto_chunks_per_grad_vram_target_frac: 0.82
  auto_pixel_chunk_size_min: 3500
  auto_pixel_chunk_size_step: 100
  quiet_training: true
  refit_extra_scaler: false
  suffix_prefix: soil_moco
  model_n_layers: 1

search:
  strategy: grid

  parameters:
    model_d_model:
      type: choice
      values: [64, 96, 128]

    model_n_head:
      type: choice
      values: [4, 8]

    model_d_inner:
      type: choice
      values: [64, 128]

    model_dropout:
      type: choice
      values: [0.3, 0.4]

    learning_rate:
      type: choice
      values: [1.0e-4, 5.0e-4]

  # Late soil fusion ablation (appended after the early grid → trials 049–056).
  # Corners of the arch grid × both LRs; dropout fixed at 0.3.
  extra_trials:
    - soil_fusion: late
      model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.3
      learning_rate: 1.0e-4

    - soil_fusion: late
      model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.3
      learning_rate: 5.0e-4

    - soil_fusion: late
      model_d_model: 96
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      learning_rate: 1.0e-4

    - soil_fusion: late
      model_d_model: 96
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      learning_rate: 5.0e-4

    - soil_fusion: late
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      learning_rate: 1.0e-4

    - soil_fusion: late
      model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3
      learning_rate: 5.0e-4

    - soil_fusion: late
      model_d_model: 128
      model_n_head: 8
      model_d_inner: 128
      model_dropout: 0.3
      learning_rate: 5.0e-4

    - soil_fusion: late
      model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.4
      learning_rate: 5.0e-4
