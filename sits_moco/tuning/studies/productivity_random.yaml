# Random-search study — broader exploration with fewer trials (~16).
#
#   python run_tuning_study.py run tuning/studies/productivity_random.yaml --skip-completed

name: productivity_random

objective: val_r2

output_dir: ./results/tuning

base:
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral
  yield_csv: files/pam_soy_pr_2019_2025.csv
  logdir: ./results
  seed: 27
  epochs: 45
  workers: 4
  sequencelength: 45
  batchsize: 8
  rc: false
  warmup_epochs: 0
  no_compile: false
  overwrite_run: true
  early_stop_patience: 15
  pixel_chunk_size: 16000
  prefetch_chunks: 2
  chunks_per_grad: 1
  quiet_training: true

search:
  strategy: random
  n_trials: 16
  seed: 42

  parameters:
    learning_rate:
      type: log_uniform
      low: 1.0e-6
      high: 3.0e-5

    weight_decay:
      type: log_uniform
      low: 1.0e-5
      high: 1.0e-3

    sample_ratio:
      type: choice
      values: [1.0, 0.8, 0.6]

    rc:
      type: choice
      values: [false, true]

    model_n_layers:
      type: choice
      values: [1, 2, 3]

    model_n_head:
      type: choice
      values: [4, 8, 16]

    model_d_model:
      type: choice
      values: [96, 128, 192]

    model_d_inner:
      type: choice
      values: [128, 256, 512]

    model_dropout:
      type: float_uniform
      low: 0.15
      high: 0.45

    schedule:
      type: choice
      values:
        - null
        - [20, 30]
        - [25, 35]

    feature_layout:
      type: choice
      values: [spectral, spectral_xavier]
