# Architecture tuning focused on reducing overfitting (productivity / t/ha).
#
# Searches smaller widths, fewer layers, and higher dropout vs Seed27 defaults.
# Training hyperparams stay fixed; regularization is mostly in model shape + dropout.
# Uses municipality–year pairs with coverage_ratio in [0.8, 1.2] only.
#
# 36 trials = 3 d_model × 2 n_head × 2 d_inner × 3 dropout × 1 n_layers
# (n_layers fixed at 1 in base; increase only if you add it to search)
#
# Preview:
#   python run_tuning_study.py show tuning/studies/productivity_architecture.yaml --list-trials
#
# Run (resumable; skips only successful trials):
#   python run_tuning_study.py run tuning/studies/productivity_architecture.yaml --skip-completed
#
# After changing base recipe (LR, epochs, …), rerun all trials:
#   python run_tuning_study.py run tuning/studies/productivity_architecture.yaml --rerun-all

name: productivity_architecture_xavier

objective: val_r2

output_dir: ./results/tuning

# Fixed training recipe (Seed27 baseline). Tune architecture separately from LR/batch.
base:
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral_xavier
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 100
  workers: 20
  sequencelength: 45
  batchsize: 40
  learning_rate: 5.0e-4
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [20, 75]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  pixel_chunk_size: 8000
  chunks_per_grad: 50
  prefetch_chunks: 30
  auto_chunks_per_grad: true
  auto_chunks_per_grad_min: 1
  auto_chunks_per_grad_vram_frac: 0.95
  auto_chunks_per_grad_vram_target_frac: 0.90
  auto_pixel_chunk_size_min: 3500
  auto_pixel_chunk_size_step: 100
  quiet_training: true
  # Seed27 default was n_layers=1, d_model=128, d_inner=128, n_head=16, dropout=0.2
  model_n_layers: 1

search:
  strategy: grid

  parameters:
    model_d_model:
      type: choice
      values: [64, 96, 128]

    model_n_head:
      type: choice
      values: [4, 8, 16]

    model_d_inner:
      type: choice
      values: [64, 128]

    model_dropout:
      type: choice
      values: [0.3, 0.4]
