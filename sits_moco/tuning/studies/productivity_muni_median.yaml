# Exercise: one mega-pixel per municipality (spatial median per date), then STNet.
# Full climate inputs (spectral_xavier_full); random encoder init — no MoCo.
#
# Build inputs (does not overwrite original pixel files):
#   python preprocessing/aggregate_municipal_npy.py --stat median -j 8 --overwrite
# Default output: {SITS_MOCO_DATAPATH parent}/npy_muni_median
#
# Preview / run:
#   python run_tuning_study.py show tuning/studies/productivity_muni_median.yaml --list-trials
#   python run_tuning_study.py run tuning/studies/productivity_muni_median.yaml --skip-completed

name: productivity_muni_median

objective: val_r2

output_dir: ./results/tuning

base:
  datapath: ~/sits_moco_data/npy_muni_median
  target: productivity
  harvest_years: "2020,2021,2022,2023,2024"
  feature_layout: spectral_xavier_full
  yield_csv: files/pam_soy_pr_2019_2025_coverage_0.8_1.2.csv
  no_coverage_filter: true
  logdir: ./results
  seed: 101010
  epochs: 1000
  workers: 4
  sequencelength: 45
  batchsize: 40
  learning_rate: 1.0e-5
  weight_decay: 5.0e-4
  sample_ratio: 1.0
  rc: false
  warmup_epochs: 0
  schedule: [150, 750]
  no_compile: true
  overwrite_run: true
  early_stop_patience: 10
  checkpoint_every: 0
  pixel_chunk_size: 8
  chunks_per_grad: 1
  prefetch_chunks: 4
  quiet_training: true
  model_n_layers: 1

search:
  strategy: list

  # Same five arches as productivity_top5_moco_parana (no MoCo init).
  trials:
    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.4

    - model_d_model: 64
      model_n_head: 16
      model_d_inner: 128
      model_dropout: 0.4

    - model_d_model: 128
      model_n_head: 4
      model_d_inner: 128
      model_dropout: 0.3

    - model_d_model: 64
      model_n_head: 4
      model_d_inner: 64
      model_dropout: 0.4

    - model_d_model: 96
      model_n_head: 8
      model_d_inner: 64
      model_dropout: 0.3
